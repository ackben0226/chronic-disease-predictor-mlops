[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=html
    --cov-report=term

# Markers for grouping tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests