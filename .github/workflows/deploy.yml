name: Build, Test, and Deploy ML API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACR_NAME: mlhealthacr
  IMAGE_NAME: health-predictor
  RESOURCE_GROUP: ml-health-predictor
  CONTAINER_NAME: health-predictor-api
  KEY_VAULT_URL: https://mlhealthkeyvault.vault.azure.net/

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=deployment --cov=monitoring || true

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}
      - name: Build and push
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete old container
        run: |
          az container delete \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_NAME }} \
            --yes || true
          sleep 15

      - name: Deploy new container
        run: |
          az container create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_NAME }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --dns-name-label health-predictor \
            --ports 8000 \
            --cpu 2 \
            --memory 4 \
            --os-type Linux \
            --registry-login-server ${{ env.ACR_NAME }}.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --environment-variables KEY_VAULT_URL="${{ env.KEY_VAULT_URL }}"

      - name: Verify deployment (with retries)
        run: |
          echo "⏳ Getting container IP..."
          IP=$(az container show --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CONTAINER_NAME }} --query ipAddress.ip --output tsv)
          echo "API IP: $IP"
          echo "⏳ Waiting for container to fully start (model loading)..."
          sleep 60
          
          # Retry health check up to 10 times
          for i in {1..10}; do
            echo "Attempt $i/10: Checking health..."
            if curl -f -s --max-time 10 "http://$IP:8000/health"; then
              echo ""
              echo "✅ Health check passed! Deployment successful."
              exit 0
            fi
            echo "Not ready yet, waiting 10s..."
            sleep 10
          done
          
          echo "⚠️ Health check did not pass in time."
          echo "This does not mean deployment failed - the container is likely still starting."
          echo "Check manually: http://$IP:8000/health"
          exit 0  # Don't fail the workflow
